<mat-expansion-panel class="mb-3 shadow-none border border-gray-200 rounded-lg">
	<mat-expansion-panel-header>
		<mat-panel-title class="text-sm">
			<mat-icon class="text-blue-500 mr-2 flex items-center" style="font-size: 20px">edit</mat-icon>
			Modifier le mot de passe
		</mat-panel-title>
	</mat-expansion-panel-header>
	<div>
		<form [formGroup]="passwordForm" (ngSubmit)="onSubmit()">
			<div class="password-fields">
				<app-revlib-password-field [fullWidth]="true" controlName="currentPassword" label="Mot de passe" />
				<app-revlib-password-field [fullWidth]="true" controlName="newPassword" label="Nouveau mot de passe" />
				<app-revlib-password-field
					[fullWidth]="true"
					controlName="confirmNewPassword"
					label="Confirmer le mot de passe" />
			</div>

			@if (passwordForm.hasError('passwordMismatch') && passwordForm.touched) {
				<mat-error>Les mots de passe ne correspondent pas.</mat-error>
			}

			@if (passwordForm.hasError('sameAsCurrent') && passwordForm.touched) {
				<mat-error> Le nouveau mot de passe doit être différent de l'ancien mot de passe. </mat-error>
			}

			<div class="actions">
				<button mat-raised-button color="primary" type="submit" [disabled]="passwordForm.invalid || isLoading()">
					@if (isLoading()) {
						<mat-icon fontIcon="sync" class="spin"></mat-icon>
					}
					Appliquer
				</button>
			</div>
		</form>

		<!-- Backend messages -->
		<app-revlib-backend-result [errorResult]="errorResult()" [successMessage]="successMessage()">
		</app-revlib-backend-result>
	</div>
</mat-expansion-panel>
