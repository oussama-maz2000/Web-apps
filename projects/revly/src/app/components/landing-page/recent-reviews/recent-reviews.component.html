<section class="py-24 bg-slate-50 px-4 sm:px-6 lg:px-8">
	<div class="max-w-7xl mx-auto">
		<div class="text-center mb-16">
			<h2 class="text-4xl font-bold text-gray-900 mb-4">Avis récents</h2>
			<p class="text-lg text-gray-600 max-w-2xl mx-auto">
				Découvrez ce que notre communauté a à dire sur ses dernières expériences
			</p>
		</div>

		<div class="grid gap-8 md:grid-cols-2 lg:grid-cols-3">
			@for (review of reviews(); track review.id) {
				<article
					class="bg-white rounded-2xl p-8 shadow-sm border border-gray-100 flex flex-col transition-all duration-300 hover:shadow-xl hover:-translate-y-1">
					<div class="flex items-center gap-4 mb-6">
						@if (review.reviewer.profilePictureUrl !== null) {
							<img
								[src]="buildImageUrl(review.reviewer.profilePictureUrl, 'medium')"
								[alt]="review.reviewer.name"
								class="w-12 h-12 rounded-full object-cover border-2 border-white shadow-sm" />
						} @else {
							<revlib-avatar
								[name]="review.reviewer!.name"
								[color]="'fff'"
								[background]="'random'"
								[size]="48"
								[rounded]="true"
								[length]="1"
								[bold]="true" />
						}
						<div class="flex-1">
							<p class="font-bold text-gray-900 leading-tight">
								{{ review.reviewer.name }}
							</p>
						</div>
					</div>

					<div class="mb-4">
						<revlib-review-stars [rating]="safeRating(review.rating)" [editable]="false"> </revlib-review-stars>
					</div>

					<div class="text-gray-600 flex-1">
						{{ review.text }}
					</div>
				</article>
			} @empty {
				<div class="col-span-full text-center py-12 text-gray-400">Chargement des avis récents...</div>
			}
		</div>
	</div>
</section>
